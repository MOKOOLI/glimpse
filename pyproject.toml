[project]
name = "glimpse"
version = "0.1.0"
description = "Early detection of rare metabolic diseases from LC-HR-MS spectra"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mohsen Koolivand", email = "mkoolivand14@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "shap>=0.44",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "streamlit>=1.30",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.3", "jupyter>=1.0"]

[project.scripts]
glimpse = "glimpse.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]